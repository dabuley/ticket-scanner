<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <title>Event Ticket Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { margin: 0 0 5px 0; color: #333; text-align: center; font-size: 28px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 14px; }
        .stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            text-align: center;
        }
        .stat-box { flex: 1; }
        .stat-number { font-size: 36px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.9; margin-top: 5px; }
        #reader { width: 100%; margin: 20px 0; border-radius: 10px; overflow: hidden; }
        #reader video { width: 100%; border-radius: 10px; }
        #result {
            padding: 25px;
            margin: 15px 0;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 22px;
        }
        .success { background: #4CAF50; color: white; }
        .error { background: #f44336; color: white; }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #5a67d8; }
        .info {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
            color: #1976d2;
        }
        .status-led {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-green { background: #4CAF50; }
        .status-red { background: #f44336; }
        progress {
            width: 100%;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎟️ Event Scanner</h1>
    <div class="subtitle">Scan tickets at the entrance</div>
    
    <div class="stats">
        <div class="stat-box"><div class="stat-number" id="total">---</div><div class="stat-label">Total</div></div>
        <div class="stat-box"><div class="stat-number" id="used">---</div><div class="stat-label">Entered</div></div>
        <div class="stat-box"><div class="stat-number" id="remaining">---</div><div class="stat-label">Remaining</div></div>
    </div>
    
    <progress id="progress" value="0" max="100"></progress>
    
    <div id="reader"></div>
    <div id="result"></div>
    
    <button onclick="startScanner()">📷 Start Camera</button>
    <button onclick="stopScanner()">⏹️ Stop Camera</button>
    
    <div class="info">
        <span class="status-led status-green"></span> Green = Valid Entry<br>
        <span class="status-led status-red"></span> Red = Invalid or Used<br>
        1️⃣ Click "Start Camera"<br>
        2️⃣ Grant camera permission<br>
        3️⃣ Scan QR code
    </div>
</div>

<script>
// ============================================
// IMPORTANT: Replace with your Apps Script URL
// ============================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbz-w8aqecl5_560g105H7D8gtMsn2WSlaRNotkfuBCVMGEONKS-dEdCyCggLm8euWyYGQ/exec/exec';
// ============================================

let html5QrCode = null;
let isScanning = false;
let lastScan = '';

async function startScanner() {
    if (isScanning) {
        alert("Scanner is already running");
        return;
    }
    
    try {
        html5QrCode = new Html5Qrcode("reader");
        await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 300, height: 300 } },
            (decodedText) => {
                if (decodedText === lastScan) return;
                lastScan = decodedText;
                validateTicket(decodedText);
                setTimeout(() => { lastScan = ''; }, 2000);
            },
            (error) => { console.log("Scanning...", error); }
        );
        isScanning = true;
        document.getElementById('result').innerHTML = '✅ Camera ready - Scan a QR code';
        document.getElementById('result').className = '';
    } catch (err) {
        console.error("Camera error:", err);
        document.getElementById('result').innerHTML = '❌ Camera error: ' + err.message + '. Make sure you clicked Allow.';
        document.getElementById('result').className = 'error';
    }
}

async function stopScanner() {
    if (html5QrCode && isScanning) {
        await html5QrCode.stop();
        html5QrCode.clear();
        isScanning = false;
        document.getElementById('result').innerHTML = '⏹️ Scanner stopped';
        document.getElementById('result').className = '';
    }
}

async function validateTicket(ticketCode) {
    const resultDiv = document.getElementById('result');
    try {
        const response = await fetch(APPS_SCRIPT_URL + '?code=' + encodeURIComponent(ticketCode));
        const data = await response.json();
        
        resultDiv.innerHTML = data.message;
        resultDiv.className = data.status === 'success' ? 'success' : 'error';
        
        // Flash background
        document.body.style.backgroundColor = data.status === 'success' ? '#4CAF50' : '#f44336';
        setTimeout(() => { document.body.style.backgroundColor = ''; }, 500);
        
        if (data.status === 'success') updateStats();
        
        setTimeout(() => {
            if (resultDiv.className !== '') {
                resultDiv.className = '';
                resultDiv.innerHTML = data.status === 'success' ? '✅ Ready for next scan' : '⚠️ Try another ticket';
            }
        }, 2500);
    } catch (error) {
        console.error('Validation error:', error);
        resultDiv.innerHTML = '❌ Connection error. Check internet.';
        resultDiv.className = 'error';
    }
}

async function updateStats() {
    try {
        const response = await fetch(APPS_SCRIPT_URL + '?action=stats');
        const data = await response.json();
        document.getElementById('total').textContent = data.total;
        document.getElementById('used').textContent = data.used;
        document.getElementById('remaining').textContent = data.total - data.used;
        document.getElementById('progress').max = data.total;
        document.getElementById('progress').value = data.used;
    } catch (error) {
        console.error('Stats error:', error);
    }
}

// Auto-start scanner when page loads
window.addEventListener('load', () => {
    updateStats();
    setTimeout(() => startScanner(), 500);
});
</script>
</body>
</html>
