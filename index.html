<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Event Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 25px; }
        #reader { width: 100%; margin: 20px 0; border-radius: 10px; overflow: hidden; }
        .result { padding: 30px; font-size: 24px; font-weight: bold; border-radius: 15px; margin: 20px 0; }
        .success { background: #4CAF50; color: white; }
        .error { background: #f44336; color: white; }
        .stats { background: #f0f0f0; padding: 15px; border-radius: 10px; margin: 20px 0; }
        button { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎟️ Event Check-In Scanner</h2>
    <div class="stats">
        📊 <span id="stats">Ready to scan</span>
    </div>
    <div id="reader"></div>
    <div id="result"></div>
    <button onclick="location.reload()">🔄 New Scan</button>
</div>

<script>
// CONFIGURE THIS: Your Google Sheet ID
const SPREADSHEET_ID = 1HwE_Wu4t4Ixs8qBxUlykfsJsCtCP1rWQHZNO8UwfSrs;  // Get from sheet URL
const SHEET_NAME = 'Sheet1';  // Your sheet name

// Scanner setup
let lastScan = '';
const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    async (decodedText) => {
        if (decodedText === lastScan) return;
        lastScan = decodedText;
        
        const result = await checkTicket(decodedText);
        const resultDiv = document.getElementById('result');
        resultDiv.textContent = result.message;
        resultDiv.className = result.status === 'success' ? 'result success' : 'result error';
        
        // Flash background
        document.body.style.backgroundColor = result.status === 'success' ? '#4CAF50' : '#f44336';
        setTimeout(() => { document.body.style.backgroundColor = ''; }, 1000);
        
        setTimeout(() => { 
            resultDiv.className = ''; 
            lastScan = ''; 
        }, 2000);
        
        updateStats();
    }
).catch(err => {
    console.error(err);
    document.getElementById('result').innerHTML = '❌ Camera error: ' + err;
});

async function checkTicket(ticketCode) {
    try {
        // Using Google Apps Script as a proxy (this is the only part needing GAS)
        const response = await fetch('https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbwRert2PrsWqtcoL8uc6Sg9EK-76F1qGdTM4XYCOJXMhkCxwZkgb_R0H-CGM6zw3ulY/exec/exec?code=' + encodeURIComponent(ticketCode));
        const data = await response.json();
        return data;
    } catch (error) {
        return { status: 'error', message: '❌ Connection error' };
    }
}

async function updateStats() {
    try {
        const response = await fetch('https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbwRert2PrsWqtcoL8uc6Sg9EK-76F1qGdTM4XYCOJXMhkCxwZkgb_R0H-CGM6zw3ulY/exec/exec?action=stats');
        const data = await response.json();
        document.getElementById('stats').innerHTML = `Entered: ${data.used} / ${data.total}`;
    } catch(e) {}
}
</script>
</body>
</html>
